name: Antigravity Cloud Wakeup

on:
  schedule:
    - cron: '0 0,9,18 * * *'
    - cron: '30 4,13,22 * * *'
  workflow_dispatch:

jobs:
  ping-models:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send Pings via Direct API
        env:
          AG_CONFIG: ${{ secrets.AG_CONFIG_JSON }}
        run: |
          node -e '
            const https = require("https");

            async function run() {
              const input = JSON.parse(process.env.AG_CONFIG);
              const accessToken = input.tokens.accessToken;
              const projectId = input.tokens.projectId || "rapid-epigram-4jcsn";

              console.log("🚀 Starting direct API wake-up ping...");

              // Payload forcing a ~500-word essay to burn tokens and trigger quota reset
              const data = JSON.stringify({
                contents: [{
                  parts: [{ text: "Please write a comprehensive 500-word essay about the history of the internet." }]
                }]
              });

              const options = {
                hostname: "us-central1-aiplatform.googleapis.com",
                path: `/v1/projects/${projectId}/locations/us-central1/publishers/google/models/gemini-2.5-flash:generateContent`,
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${accessToken}`,
                  "Content-Type": "application/json",
                  "Content-Length": data.length
                }
              };

              await new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let body = "";
                  res.on("data", (chunk) => body += chunk);
                  res.on("end", () => {
                    if (res.statusCode === 200) {
                      console.log("✅ Successfully pinged API! Response received.");
                      resolve();
                    } else {
                      console.log(`⚠️ API returned status ${res.statusCode}: ${body}`);
                      // Don’t fail the workflow if an endpoint shifts slightly, just log it
                      resolve();
                    }
                  });
                });

                req.on("error", (err) => {
                  console.error("❌ Request error:", err);
                  resolve();
                });

                req.write(data);
                req.end();
              });
            }

            run();
          '
