name: Antigravity Cloud Wakeup

on:
  schedule:
    # Runs precisely every 4.5 hours (alternating intervals)
    - cron: '0 0,9,18 * * *'
    - cron: '30 4,13,22 * * *'
  workflow_dispatch:

jobs:
  ping-models:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install antigravity-usage CLI
        run: npm install -g antigravity-usage

      - name: Restore Auth Config
        env:
          AG_CONFIG: ${{ secrets.AG_CONFIG_JSON }}
        run: |
          # 1. Create the account directory structure
          mkdir -p ~/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/
          
          # 2. Extract and write tokens.json and metadata.json from the single secret
          echo "$AG_CONFIG" | node -e '
            const fs = require("fs");
            const input = JSON.parse(fs.readFileSync(0, "utf-8"));
            fs.writeFileSync(
              "/home/runner/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/tokens.json", 
              JSON.stringify(input.tokens, null, 2)
            );
            fs.writeFileSync(
              "/home/runner/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/metadata.json", 
              JSON.stringify(input.metadata, null, 2)
            );
          '
          
          # 3. Tell the CLI which account is active
          cat << 'EOF' > ~/.config/antigravity-usage/config.json
          {
            "version": "2.0",
            "activeAccount": "jamessafdar2111@gmail.com"
          }
          EOF

      - name: Send Pings
        run: |
          antigravity-usage wakeup test -m claude-sonnet-4-5 -p "Please write a comprehensive 500-word essay about the history of the internet."
          antigravity-usage wakeup test -m gemini-3-flash -p "Please write a comprehensive 500-word essay about the history of the internet."
