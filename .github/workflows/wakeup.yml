name: Antigravity Cloud Wakeup

on:
  schedule:
    - cron: '0 0,9,18 * * *'
    - cron: '30 4,13,22 * * *'
  workflow_dispatch:

jobs:
  ping-models:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install antigravity-usage CLI
        run: npm install -g antigravity-usage

      - name: Restore Auth Config
        env:
          AG_CONFIG: ${{ secrets.AG_CONFIG_JSON }}
        run: |
          mkdir -p ~/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/
          echo "$AG_CONFIG" | node -e '
            const fs = require("fs");
            const input = JSON.parse(fs.readFileSync(0, "utf-8"));
            fs.writeFileSync("/home/runner/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/tokens.json", JSON.stringify(input.tokens, null, 2));
            fs.writeFileSync("/home/runner/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/metadata.json", JSON.stringify(input.metadata, null, 2));
          '
          cat << 'EOF' > ~/.config/antigravity-usage/config.json
          {
            "version": "2.0",
            "activeAccount": "jamessafdar2111@gmail.com"
          }
          EOF

      - name: Run Headless Wakeup
        env:
          CI: true
        run: |
          antigravity-usage wakeup --yes || antigravity-usage quota --all
