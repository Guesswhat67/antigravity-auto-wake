name: Antigravity Cloud Wakeup

on:
  schedule:
    - cron: '0 0,9,18 * * *'
    - cron: '30 4,13,22 * * *'
  workflow_dispatch:

jobs:
  ping-models:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install antigravity-usage
        run: npm install -g antigravity-usage

      - name: Restore Auth & Config
        env:
          AG_CONFIG: ${{ secrets.AG_CONFIG_JSON }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const os = require("os");

            const home = os.homedir();
            const email = "jamessafdar2111@gmail.com";
            const configDir = path.join(home, ".config", "antigravity-usage");
            const accountDir = path.join(configDir, "accounts", email);
            const wakeupDir = path.join(configDir, "wakeup");

            fs.mkdirSync(accountDir, { recursive: true });
            fs.mkdirSync(wakeupDir, { recursive: true });

            const input = JSON.parse(process.env.AG_CONFIG);
            fs.writeFileSync(path.join(accountDir, "tokens.json"), JSON.stringify(input.tokens, null, 2));
            fs.writeFileSync(path.join(accountDir, "metadata.json"), JSON.stringify(input.metadata, null, 2));
            fs.writeFileSync(path.join(configDir, "config.json"), JSON.stringify({ version: "2.0", activeAccount: email }, null, 2));

            // Write wakeup config — trigger reads this, no prompts
            fs.writeFileSync(path.join(wakeupDir, "config.json"), JSON.stringify({
              enabled: true,
              selectedModels: ["claude-sonnet-4-5", "gemini-3-flash", "gemini-3-pro-low", "gemini-2.5"],
              selectedAccounts: [email],
              customPrompt: "Please write a comprehensive 500-word essay about the history of the internet.",
              maxOutputTokens: 1000,
              scheduleMode: "interval",
              intervalHours: 4.5
            }, null, 2));

            console.log("✅ Auth + wakeup config written.");
          '

      - name: Trigger Wakeup (No Prompts)
        run: antigravity-usage wakeup trigger
