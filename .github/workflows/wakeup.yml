name: Antigravity Cloud Wakeup

on:
  schedule:
    - cron: '0 0,9,18 * * *'
    - cron: '30 4,13,22 * * *'
  workflow_dispatch:

jobs:
  ping-models:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install antigravity-usage CLI
        run: npm install -g antigravity-usage

      - name: Restore Auth Config
        env:
          AG_CONFIG: ${{ secrets.AG_CONFIG_JSON }}
        run: |
          mkdir -p ~/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/
          echo "$AG_CONFIG" | node -e '
            const fs = require("fs");
            const input = JSON.parse(fs.readFileSync(0, "utf-8"));
            fs.writeFileSync("/home/runner/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/tokens.json", JSON.stringify(input.tokens, null, 2));
            fs.writeFileSync("/home/runner/.config/antigravity-usage/accounts/jamessafdar2111@gmail.com/metadata.json", JSON.stringify(input.metadata, null, 2));
          '
          cat << 'EOF' > ~/.config/antigravity-usage/config.json
          {
            "version": "2.0",
            "activeAccount": "jamessafdar2111@gmail.com"
          }
          EOF

      - name: Run Auto-Wakeup
        run: |
          # 1. Refresh Google tokens
          antigravity-usage quota --all
          
          # 2. Ping Claude
          antigravity-usage wakeup test -m opus-4-6 -p "Please write a comprehensive 500-word essay about the history of the internet." || true
          
          # 3. Ping GPT
          antigravity-usage wakeup test -m gpt-4-5 -p "Please write a comprehensive 500-word essay about the history of the internet." || true
          
          # 4. Ping Gemini (Using multiple versions to guarantee a hit)
          antigravity-usage wakeup test -m gemini-3.7-flash -p "Please write a comprehensive 500-word essay about the history of the internet." || true
          antigravity-usage wakeup test -m gemini-3-flash -p "Please write a comprehensive 500-word essay about the history of the internet." || true
          antigravity-usage wakeup test -m gemini-2.5 -p "Please write a comprehensive 500-word essay about the history of the internet." || true
